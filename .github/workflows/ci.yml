name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: OpenGAP manifest
        run: |
          npm i -g @open-gitagent/opengap
          opengap validate
      - name: Determinism across a fresh checkout
        run: |
          orgono map --quiet --json > /tmp/a.json
          rm -rf .orgono
          orgono map --quiet --json > /tmp/b.json
          python - <<'PY'
          import json
          a = json.load(open("/tmp/a.json")); b = json.load(open("/tmp/b.json"))
          for k in ("elapsed_ms", "timings_ms", "trace_id"):
              a.pop(k, None); b.pop(k, None)
          assert a == b, "graph is not deterministic across runs"
          print("deterministic OK")
          PY
