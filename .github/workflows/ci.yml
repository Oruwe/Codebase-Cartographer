name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The matrix is the point: orgono ships a pure-Python wheel, and a pure-Python
  # wheel is exactly what hides platform bugs (path separators, line endings,
  # file modes) until a user on another OS hits them.
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI on this OS
        run: |
          orgono --version
          orgono doctor
          orgono map --quiet
          orgono impact extract_repo --quiet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm i -g @open-gitagent/opengap
      - run: opengap validate

  # Verify what users actually receive, not what the source tree contains.
  # An editable install reads from the source tree and cannot catch a missing
  # package-data entry.
  wheel:
    name: wheel install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel and sdist
        run: python -m pip install build && python -m build
      - name: Install the wheel into a clean environment
        # Install the built wheel itself, but let dependencies resolve from PyPI.
        # `--no-index` blocked PyPI entirely, so tree-sitter could not be found
        # and the job failed on every OS.
        shell: bash
        run: pip install dist/*.whl
      - name: The viewer's assets must be present in the installed package
        run: |
          python -c "import pathlib,orgono; w=pathlib.Path(orgono.__file__).parent/'web'; import sys; missing=[a for a in ['index.html','app.js','style.css','vendor/three.min.js','vendor/three.LICENSE'] if not (w/a).is_file()]; sys.exit('missing: '+str(missing)) if missing else print('assets ok')"
      - name: Run from the installed package
        run: |
          orgono --version
          orgono doctor

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: The same commit must yield the same graph
        run: |
          orgono map --quiet --json > a.json
          rm -rf .orgono
          orgono map --quiet --json > b.json
          python - <<'PY'
          import json
          a = json.load(open("a.json")); b = json.load(open("b.json"))
          for k in ("elapsed_ms", "timings_ms", "trace_id"):
              a.pop(k, None); b.pop(k, None)
          assert a == b, "graph is not deterministic across runs"
          print("deterministic OK")
          PY
